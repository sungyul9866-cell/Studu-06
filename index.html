<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a3;
      --accent: #2f80ed;
      --danger: #e5484d;
      --border: #e3e7ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8eaed;
        --muted: #8b929c;
        --accent: #5a9bf6;
        --danger: #f26b6f;
        --border: #2e3238;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .summary { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    .add-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li label { flex: 1; cursor: pointer; word-break: break-word; }
    li.done label { text-decoration: line-through; color: var(--muted); }
    .del-btn {
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 8px;
    }
    .del-btn:hover { color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .footer { display: flex; justify-content: flex-end; margin-top: 16px; }
    .clear-btn {
      background: transparent;
      color: var(--danger);
      font-size: 0.9rem;
      padding: 6px 10px;
    }
    .clear-btn:disabled { color: var(--muted); cursor: default; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary"></p>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autocomplete="off" required />
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">리스트가 비어 있어요.</p>

    <div class="footer">
      <button class="clear-btn" id="clear-done">완료 항목 삭제</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "shopping-list";
    const form = document.getElementById("add-form");
    const input = document.getElementById("item-input");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const summaryEl = document.getElementById("summary");
    const clearBtn = document.getElementById("clear-done");

    let items = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {}
    }

    function render() {
      listEl.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "item-" + item.id;
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggle(item.id));

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = item.name;

        const del = document.createElement("button");
        del.className = "del-btn";
        del.title = "삭제";
        del.setAttribute("aria-label", item.name + " 삭제");
        del.textContent = "✕";
        del.addEventListener("click", () => remove(item.id));

        li.append(checkbox, label, del);
        listEl.appendChild(li);
      }

      const doneCount = items.filter((i) => i.done).length;
      emptyEl.hidden = items.length > 0;
      summaryEl.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개`;
      clearBtn.disabled = doneCount === 0;
    }

    function add(name) {
      items.push({ id: Date.now(), name, done: false });
      save();
      render();
    }

    function toggle(id) {
      const item = items.find((i) => i.id === id);
      if (item) item.done = !item.done;
      save();
      render();
    }

    function remove(id) {
      items = items.filter((i) => i.id !== id);
      save();
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      add(name);
      input.value = "";
      input.focus();
    });

    clearBtn.addEventListener("click", () => {
      items = items.filter((i) => !i.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
