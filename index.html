<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a3;
      --accent: #2f80ed;
      --danger: #e5484d;
      --border: #e3e7ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8eaed;
        --muted: #8b929c;
        --accent: #5a9bf6;
        --danger: #f26b6f;
        --border: #2e3238;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .summary { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    .add-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li label { flex: 1; cursor: pointer; word-break: break-word; }
    li.done label { text-decoration: line-through; color: var(--muted); }
    .del-btn {
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 8px;
    }
    .del-btn:hover { color: var(--danger); }
    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--danger);
      border: 1px solid var(--danger);
      font-size: 0.9rem;
    }
    .error[hidden] { display: none; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .footer { display: flex; justify-content: flex-end; margin-top: 16px; }
    .clear-btn {
      background: transparent;
      color: var(--danger);
      font-size: 0.9rem;
      padding: 6px 10px;
    }
    .clear-btn:disabled { color: var(--muted); cursor: default; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary"></p>
    <p class="error" id="error" role="alert" hidden></p>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autocomplete="off" required />
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">리스트가 비어 있어요.</p>

    <div class="footer">
      <button class="clear-btn" id="clear-done">완료 항목 삭제</button>
    </div>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // 공개(publishable) 키는 브라우저에 노출되어도 되는 키이며, 접근 제어는 RLS 정책이 담당한다
    const SUPABASE_URL = "https://vvcfsurvsktadrszltzq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WVTLmMvHMg6wGT0jG_Q1HQ_B2q8p1ww";
    const TABLE = "shopping_item";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("add-form");
    const input = document.getElementById("item-input");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const summaryEl = document.getElementById("summary");
    const clearBtn = document.getElementById("clear-done");
    const errorEl = document.getElementById("error");

    let items = [];

    function showError(message, error) {
      if (error) console.error(error);
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    async function load() {
      const { data, error } = await supabase
        .from(TABLE)
        .select("id, name, done")
        .order("created_at", { ascending: true });
      if (error) return showError("목록을 불러오지 못했어요.", error);
      showError("");
      items = data;
      render();
    }

    function render() {
      listEl.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "item-" + item.id;
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggle(item.id));

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = item.name;

        const del = document.createElement("button");
        del.className = "del-btn";
        del.title = "삭제";
        del.setAttribute("aria-label", item.name + " 삭제");
        del.textContent = "✕";
        del.addEventListener("click", () => remove(item.id));

        li.append(checkbox, label, del);
        listEl.appendChild(li);
      }

      const doneCount = items.filter((i) => i.done).length;
      emptyEl.hidden = items.length > 0;
      summaryEl.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개`;
      clearBtn.disabled = doneCount === 0;
    }

    async function add(name) {
      const { data, error } = await supabase
        .from(TABLE)
        .insert({ name })
        .select("id, name, done")
        .single();
      if (error) return showError("항목을 추가하지 못했어요.", error);
      showError("");
      items.push(data);
      render();
    }

    async function toggle(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      const done = !item.done;
      const { error } = await supabase.from(TABLE).update({ done }).eq("id", id);
      if (error) {
        showError("상태를 변경하지 못했어요.", error);
        return render();
      }
      showError("");
      item.done = done;
      render();
    }

    async function remove(id) {
      const { error } = await supabase.from(TABLE).delete().eq("id", id);
      if (error) return showError("항목을 삭제하지 못했어요.", error);
      showError("");
      items = items.filter((i) => i.id !== id);
      render();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      input.value = "";
      input.focus();
      await add(name);
    });

    clearBtn.addEventListener("click", async () => {
      const doneIds = items.filter((i) => i.done).map((i) => i.id);
      if (doneIds.length === 0) return;
      const { error } = await supabase.from(TABLE).delete().in("id", doneIds);
      if (error) return showError("완료 항목을 삭제하지 못했어요.", error);
      showError("");
      items = items.filter((i) => !i.done);
      render();
    });

    render();
    load();
  </script>
</body>
</html>
